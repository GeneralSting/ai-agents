[project]
name = "ai-agents"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/llm.py"]
sources = ["src"]
